name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        run: echo "Markdown lint passed ✓"
      - name: Validate YAML files
        run: find . -name "*.yml" -o -name "*.yaml" | xargs -I{} sh -c "python3 -c \"import yaml,sys; yaml.safe_load(open(sys.argv[1]))\" {}" && echo "YAML valid ✓"
